<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第 4 课：矩阵与坐标系</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #253656, #070912 70%); color: #edf4ff; }
    main { width: min(1080px, 94vw); display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: stretch; }
    aside { padding: 22px; border: 1px solid rgba(255,255,255,.14); border-radius: 20px; background: rgba(9, 13, 26, .78); box-shadow: 0 22px 70px rgba(0,0,0,.35); }
    h1 { margin: 0 0 12px; font-size: 23px; }
    p { line-height: 1.7; color: #cdd8ff; }
    code { color: #92f7c8; }
    canvas { width: 100%; height: min(70vh, 640px); min-height: 420px; border-radius: 20px; border: 1px solid rgba(255,255,255,.16); background: #05060c; box-shadow: 0 24px 80px rgba(0,0,0,.42); }
    .metric { margin-top: 14px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.08); font-size: 14px; line-height: 1.7; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } canvas { min-height: 360px; } }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>第 4 课：矩阵与坐标系</h1>
      <p>本 demo 用 JavaScript 计算 <code>projection × view × model</code>，再传入顶点着色器。</p>
      <p>观察旋转立方体和深度测试，建立从局部坐标到裁剪空间的完整链路。</p>
      <div id="status" class="metric">正在初始化 WebGL...</div>
    </aside>
    <canvas id="gl-canvas" aria-label="matrix coordinate systems demo"></canvas>
  </main>
  <script src="./src/main.js"></script>
</body>
</html>
